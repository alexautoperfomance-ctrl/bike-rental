<script>
const KEY='ebikeRental.v2';const APP_VER='v27';
const TABS=[['dash','Сводка'],['overdue','Просрочки'],['rentals','Аренды'],['bikes','Велосипеды'],['clients','Арендаторы'],['docs','Договоры'],['data','Данные']];
const ST={free:'свободен',rent:'в аренде',buyout:'выкуп',owned:'выкуплен',repair:'ремонт'};
const ST_CLS={free:'free',rent:'rent',buyout:'buyout',owned:'owned',repair:'repair'};
const METHODS=['Наличные','Перевод','Карта','СБП'];
let tab='dash',cur=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let MASK=true; /* при каждом запуске суммы скрыты; 👁 показывает до следующего открытия */
const rub=n=>MASK?'*** ₽':Math.round(+n||0).toLocaleString('ru-RU')+' ₽';
function toggleMask(){MASK=!MASK;updEye();render()}
function updEye(){const e=document.getElementById('eye');e.textContent=MASK?'🙈':'👁';e.setAttribute('aria-pressed',MASK)}
/* ===== Фото: IndexedDB (id -> dataURL JPEG), в объектах хранится массив id ===== */
const PHOTOS=new Map();let idb;
function idbOpen(){return new Promise((ok,no)=>{const q=indexedDB.open('ebikePhotos',1);q.onupgradeneeded=()=>q.result.createObjectStore('photos');q.onsuccess=()=>ok(idb=q.result);q.onerror=()=>no(q.error)})}
const idbTx=(mode,fn)=>new Promise((ok,no)=>{const t=idb.transaction('photos',mode);const st=t.objectStore('photos');const r=fn(st);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)});
async function loadPhotos(){try{await idbOpen();const all={};await new Promise((ok,no)=>{const c=idb.transaction('photos').objectStore('photos').openCursor();c.onsuccess=()=>{const x=c.result;if(x){PHOTOS.set(x.key,x.value);x.continue()}else ok()};c.onerror=()=>no(c.error)})}catch(e){console.warn('IndexedDB недоступна',e)}}
const putPhoto=(id,data)=>{PHOTOS.set(id,data);return idbTx('readwrite',st=>st.put(data,id))};
const delPhoto=id=>{PHOTOS.delete(id);return idbTx('readwrite',st=>st.delete(id))};
function compress(file,max=1280,q=0.7){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',q))};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Не удалось прочитать изображение'))};im.src=u})}
function viewPhoto(id){const d=PHOTOS.get(id);if(!d)return;document.getElementById('viewerImg').src=d;document.getElementById('viewer').style.display='flex'}
function thumbs(list){list=(list||[]).filter(id=>PHOTOS.has(id));return list.length?`<img class="thumb" src="${PHOTOS.get(list[0])}" onclick="event.stopPropagation();viewPhoto('${list[0]}')">${list.length>1?'<span class="muted">📷'+list.length+'</span>':''}`:''}
let PH=null,PHB=null; /* редактирование фото в диалоге: {list, added:[]}; PHB — фото велосипеда в форме арендатора */
const PHS={PH:{sfx:''},PHB:{sfx:'B'}};const phObj=k=>k==='PHB'?PHB:PH;
function photoField(list,label,k='PH'){const o={list:[...(list||[])],added:[]};if(k==='PHB')PHB=o;else{PH=o;PHB=null}const x=PHS[k].sfx;return `<label>${label}</label><div class="ph" id="phBox${x}"></div><input type="file" id="phIn${x}" accept="image/*" multiple onchange="addPhotos(this,'${k}')"><div class="muted" id="phMsg${x}"></div>`}
function drawPh(k='PH'){const o=phObj(k);if(!o)return;const b=document.getElementById('phBox'+PHS[k].sfx);if(b)b.innerHTML=o.list.map(id=>`<div><img src="${PHOTOS.get(id)||''}" onclick="viewPhoto('${id}')"><button type="button" title="Удалить" onclick="phObj('${k}').list=phObj('${k}').list.filter(x=>x!=='${id}');drawPh('${k}')">×</button></div>`).join('')||'<span class="muted">Нет фото</span>'}
async function addPhotos(inp,k='PH'){const o=phObj(k),m=document.getElementById('phMsg'+PHS[k].sfx);m.textContent='Обработка…';for(const f of inp.files){try{const id='ph_'+uid();await putPhoto(id,await compress(f));o.list.push(id);o.added.push(id)}catch(e){alert(e.message)}}inp.value='';m.textContent='';drawPh(k)}
/* удалить из IndexedDB фото, на которые больше никто не ссылается */
function gcPhotos(){const used=new Set();[...db.bikes,...db.clients].forEach(o=>(o.photos||[]).forEach(id=>used.add(id)));[...PHOTOS.keys()].forEach(id=>{if(!used.has(id))delPhoto(id)})}
function withPhotos(owner){const prev=dlg.onclose;dlg.onclose=()=>{if(dlg.returnValue==='ok'){prev();}else{PH.added.forEach(delPhoto);if(PHB)PHB.added.forEach(delPhoto)}gcPhotos()};drawPh();drawPh('PHB')}
/* Даты — строки YYYY-MM-DD, арифметика в днях по UTC (без проблем с переходом времени) */
const DAY=86400000;const dnum=s=>Date.parse(s+'T00:00:00Z')/DAY;const dstr=n=>new Date(n*DAY).toISOString().slice(0,10);
let TODAY_OVERRIDE=null;const today=()=>TODAY_OVERRIDE||(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})();
const fd=s=>s?s.split('-').reverse().join('.'):'—';
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db||!db.bikes)db={settings:{penaltyPerDay:0,defaultWeekly:3500},bikes:[],clients:[],rentals:[]};db.settings=db.settings||{penaltyPerDay:0,defaultWeekly:3500};
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));save();
const bike=id=>db.bikes.find(x=>x.id===id)||{num:'(удалён)',vin:''};const client=id=>db.clients.find(x=>x.id===id)||{name:'(удалён)',phone:''};
const bname=b=>b.num+' '+[b.brand,b.model].filter(Boolean).join(' ')+' · '+b.vin;
/* миграция старых данных */
/* однократно: удалить демо-данные (флаг demo), записи пользователя не трогаем */
if(!db.settings.demoPurged){const ib=new Set(db.bikes.filter(b=>b.demo).map(b=>b.id)),ic=new Set(db.clients.filter(c=>c.demo).map(c=>c.id));
 db.rentals=db.rentals.filter(r=>!ib.has(r.bikeId)&&!ic.has(r.clientId));db.bikes=db.bikes.filter(b=>!ib.has(b.id));db.clients=db.clients.filter(c=>!ic.has(c.id));db.settings.demoPurged=true;save()}
db.bikes.forEach(b=>{if(b.tracker===undefined)b.tracker='';if(!b.photos)b.photos=[];for(const k of ['brand','battery1','battery2'])if(b[k]===undefined)b[k]=''});db.clients.forEach(c=>{if(!c.photos)c.photos=[]});db.rentals.forEach(r=>{normRental(r);if(!Array.isArray(r.terms))r.terms=[];autoFix(r)});save();

/* ===== Позиции аренды (parts) =====
 Аренда состоит из позиций {name, weekly, weeks}. Неделя k (0,1,2…): позиция действует, пока k < weeks (или всегда, если weeks пусто).
 Сумма недели = сумма действующих позиций. Старые аренды (без parts) → одна позиция «Велосипед». r.weekly/r.weeks хранятся для совместимости. */
function weekAmt(r,k){return r.parts.reduce((a,p)=>a+(!(p.weeks>0)||k<p.weeks?(+p.weekly||0):0),0)}
function maxWeeks(r){return Math.max(0,...r.parts.map(p=>+p.weeks||0))}
function syncLegacy(r){r.weekly=weekAmt(r,0);r.weeks=maxWeeks(r);return r}
function normRental(r){if(!Array.isArray(r.parts)||!r.parts.length)r.parts=[{name:'Велосипед',weekly:+r.weekly||0,weeks:r.buyout&&+r.weeks>0?+r.weeks:null}];
 r.parts=r.parts.map(p=>({name:String(p.name??'').trim()||'Позиция',weekly:+p.weekly||0,weeks:+p.weeks>0?Math.floor(+p.weeks):null}));return syncLegacy(r)}
/* История условий: r.terms = [{from,to,buyout,buyoutPrice,parts}] — прошлые периоды (до смены типа); текущие условия — в самой аренде, действуют с cs(r)=r.termFrom||r.start */
const cs=r=>r.termFrom||r.start;
/* авторемонт (однократно): аренда без истории, все платежи одинаковой суммы ≠ текущей ставке (условия меняли в старой версии) —
 оплаченные прошлые недели фиксируются по фактической сумме платежа, текущие условия действуют с первой неоплаченной недели. Платежи не меняются. */
function autoFix(r){if(r.fixV)return;r.fixV=1;if(r.end||r.terms.length||r.buyout)return;const P=r.payments.filter(p=>+p.amount>0);if(!P.length)return;const m=+P[0].amount;
 if(P.some(p=>+p.amount!==m)||m===weekAmt(r,0))return;const n=Math.min(P.length,Math.max(0,Math.floor((dnum(today())-dnum(r.start))/7)));if(n<1)return;const D=dstr(dnum(r.start)+7*n);
 r.terms.push({from:r.start,to:D,buyout:false,buyoutPrice:0,parts:[{name:'Велосипед (по платежам)',weekly:m,weeks:null}],auto:true});r.termFrom=D}
/* ставка прошлого периода: самая частая сумма фактических платежей текущего периода (платежи хранят свои суммы), иначе текущая ставка */
function oldRateGuess(r){const m=new Map();r.payments.filter(p=>p.date>=cs(r)&&p.date<=today()&&+p.amount>0).forEach(p=>m.set(+p.amount,(m.get(+p.amount)||0)+1));let best=0,n=0;m.forEach((c,a)=>{if(c>n){n=c;best=a}});return best||weekAmt(normRental({parts:r.parts}),0)}
const curK=r=>Math.max(0,Math.floor((dnum(today())-dnum(cs(r)))/7));
const curWeekly=r=>weekAmt(r,curK(r));
/* следующая смена суммы недели (когда позиция заканчивается) */
function nextChange(r){const k0=curK(r),a0=weekAmt(r,k0),N=maxWeeks(r);for(let k=k0+1;k<=N;k++){const a=weekAmt(r,k);if(a!==a0)return {k,due:dstr(dnum(cs(r))+7*k),amount:a}}return null}
/* прогресс позиции: сколько её недель полностью оплачено */
function partProg(r,c){return r.parts.map(p=>({...p,paidW:c.sch.filter(x=>x.status==='оплачено'&&!x.old&&(!(p.weeks>0)||x.k<p.weeks)).length,total:p.weeks>0?p.weekly*p.weeks:null}))}

function termsCard(r,c){if(!(r.terms||[]).length)return '';const T=x=>x.buyout?'выкуп':'аренда',W=p=>rub(weekAmt(normRental({parts:p.parts}),0));
 const rows=r.terms.map((p,i)=>{const S=c.sch.filter(x=>x.old&&x.per===i);return `<tr><td>${fd(p.from)} – ${fd(dstr(dnum(p.to)-1))}</td><td>${T(p)}${p.buyout?' '+rub(p.buyoutPrice):''}</td><td>${W(p)}/нед</td><td>начислено ${rub(S.reduce((a,x)=>a+x.amount,0))} · оплачено ${rub(S.reduce((a,x)=>a+x.paid,0))}</td></tr>`});
 const S=c.sch.filter(x=>!x.old&&!x.future);rows.push(`<tr><td>с ${fd(cs(r))}</td><td><b>${T(r)}</b>${r.buyout?' '+rub(r.buyoutPrice):''}</td><td>${rub(curWeekly(r))}/нед</td><td>начислено ${rub(S.filter(x=>dnum(x.due)<=dnum(today())).reduce((a,x)=>a+x.amount,0))} · оплачено ${rub(S.reduce((a,x)=>a+x.paid,0))}</td></tr>`);
 return `<div class="card tw" id="rvTerms"><h2>История условий</h2><table><tr><th>Период</th><th>Тип</th><th>₽/нед</th><th>Итог</th></tr>${rows.join('')}</table></div>`}

/* ===== Расчёты =====
 Платёж за неделю вносится авансом: даты начислений = старт + 7·k (k=0,1,2…).
 Обычная аренда: начислено всё, срок чего наступил (≤ сегодня; для закрытой — до даты окончания).
 Сумма недели k = weekAmt(r,k) (сумма действующих позиций).
 Выкуп: N = макс. срок позиций, платёж недели = weekAmt; итоговая цена = buyoutPrice (последний платёж — остаток).
 Оплаты разносятся по начислениям по порядку (FIFO).
 Долг = начислено к сегодня − оплачено. Просрочка (дн.) = сегодня − дата старейшего неоплаченного начисления.
 Пеня = просрочка (дн.) × ставка пени/день (настройка) — начисляется информационно, в долг аренды добавляется отдельной строкой. */
function schedule(r,asOf){const old=[];(r.terms||[]).forEach((p,i)=>{const v=normRental({start:p.from,parts:p.parts,buyout:p.buyout,buyoutPrice:p.buyoutPrice,end:p.to,payments:[]});
  schedule1(v,p.to).forEach(x=>{if(!x.future&&dnum(x.due)<dnum(p.to))old.push({...x,old:true,per:i})})});
 const cur=schedule1(r.terms&&r.terms.length?{...r,start:cs(r)}:r,asOf);return old.concat(cur)}
function schedule1(r,asOf){const t=dnum(asOf||today()),s=dnum(r.start);const out=[];
 if(r.buyout){const N=maxWeeks(r)||r.weeks;let left=r.buyoutPrice;for(let k=0;k<N&&left>0.001;k++){const a=k===N-1?left:Math.min(weekAmt(r,k),left);if(a>0)out.push({k,due:dstr(s+7*k),amount:a});left-=a}}
 else{const lim=r.end?Math.min(t,dnum(r.end)-1):t;let k=0;for(;s+7*k<=lim;k++){const a=weekAmt(r,k);if(a>0)out.push({k,due:dstr(s+7*k),amount:a})}
  if(k===0){out.push({k:0,due:r.start,amount:weekAmt(r,0)});k=1}
  if(!r.end){/* показать следующий платёж */const a=weekAmt(r,k);if(a>0)out.push({k,due:dstr(s+7*k),amount:a,future:true})}}
 return out}
const paidSum=r=>r.payments.reduce((s,p)=>s+(+p.amount||0),0);
function calc(r,asOf){const T=asOf||today(),t=dnum(T);const sch=schedule(r,T);let pool=paidSum(r);let accrued=0,odDays=0,nextDue=null;
 sch.forEach(x=>{const dueNow=!x.future&&dnum(x.due)<=t;x.paid=Math.min(pool,x.amount);pool-=x.paid;x.status=x.paid>=x.amount-0.001?'оплачено':(dueNow?'долг':'ожидается');
  if(dueNow)accrued+=x.amount;if(x.status==='долг'&&!odDays)odDays=t-dnum(x.due);if(x.status!=='оплачено'&&!nextDue)nextDue=x});
 /* срок платежа = день начисления; просрочка считается со следующего дня */
 const paid=paidSum(r),debt=Math.max(0,accrued-paid);if(!debt)odDays=0;
 const penalty=debt>0?odDays*(+db.settings.penaltyPerDay||0):0;
 const res={sch,paid,accrued,debt,odDays,penalty,totalDebt:debt+penalty,nextDue};
 if(r.buyout){const cp=sch.filter(x=>!x.old).reduce((a,x)=>a+x.paid,0)+Math.max(0,pool);res.towards=Math.min(cp,r.buyoutPrice);res.remaining=Math.max(0,r.buyoutPrice-cp);res.weeksLeft=sch.filter(x=>!x.old&&x.status!=='оплачено').length;res.pct=Math.round(res.towards/r.buyoutPrice*100)}
 return res}

function dueInfo(r){const t=dnum(today()),s=dnum(r.start);let n=s>t?0:Math.floor((t-s)/7)+1;if(r.buyout)n=Math.min(n,r.weeks);
 const sch=schedule(r,dstr(Math.max(t,s)+7*(n+1)));const amt=sch.slice(0,n).reduce((a,x)=>a+x.amount,0);return {elapsed:s>t?0:Math.floor((t-s)/7),n,amt,sch}}

  if(left>0.001&&out.length)out[out.length-1].amount+=left}

 for(const id of [...PHOTOS.keys()])await delPhoto(id);for(const [k,v] of Object.entries(ph))await putPhoto(k,v);
 db=d;db.settings=db.settings||{penaltyPerDay:0,defaultWeekly:3500};db.bikes.forEach(b=>{b.tracker=b.tracker||'';b.photos=b.photos||[];for(const k of ['brand','battery1','battery2'])b[k]=b[k]||''});db.clients.forEach(c=>c.photos=c.photos||[]);db.rentals.forEach(r=>{normRental(r);if(!Array.isArray(r.terms))r.terms=[];autoFix(r)});save();render();alert('Восстановлено')}).catch(e=>{console.warn(e);alert('Неверный файл')})}
