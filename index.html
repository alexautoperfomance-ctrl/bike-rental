<script>
const KEY='ebikeRental.v2';
const TABS=[['dash','Сводка'],['overdue','Просрочки'],['rentals','Аренды'],['bikes','Велосипеды'],['clients','Арендаторы'],['data','Данные']];
const ST={free:'свободен',rent:'в аренде',buyout:'выкуп',owned:'выкуплен',repair:'ремонт'};
const ST_CLS={free:'free',rent:'rent',buyout:'buyout',owned:'owned',repair:'repair'};
const METHODS=['Наличные','Перевод','Карта','СБП'];
let tab='dash',cur=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let MASK=localStorage.getItem('ebikeMask')==='1';
const rub=n=>MASK?'*** ₽':(Math.round((n||0)*100)/100).toLocaleString('ru-RU')+' ₽';
function toggleMask(){MASK=!MASK;localStorage.setItem('ebikeMask',MASK?'1':'0');updEye();render()}
function updEye(){const e=document.getElementById('eye');e.textContent=MASK?'🙈':'👁';e.setAttribute('aria-pressed',MASK)}
/* ===== Фото: IndexedDB (id -> dataURL JPEG), в объектах хранится массив id ===== */
const PHOTOS=new Map();let idb;
function idbOpen(){return new Promise((ok,no)=>{const q=indexedDB.open('ebikePhotos',1);q.onupgradeneeded=()=>q.result.createObjectStore('photos');q.onsuccess=()=>ok(idb=q.result);q.onerror=()=>no(q.error)})}
const idbTx=(mode,fn)=>new Promise((ok,no)=>{const t=idb.transaction('photos',mode);const st=t.objectStore('photos');const r=fn(st);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)});
async function loadPhotos(){try{await idbOpen();const all={};await new Promise((ok,no)=>{const c=idb.transaction('photos').objectStore('photos').openCursor();c.onsuccess=()=>{const x=c.result;if(x){PHOTOS.set(x.key,x.value);x.continue()}else ok()};c.onerror=()=>no(c.error)})}catch(e){console.warn('IndexedDB недоступна',e)}}
const putPhoto=(id,data)=>{PHOTOS.set(id,data);return idbTx('readwrite',st=>st.put(data,id))};
const delPhoto=id=>{PHOTOS.delete(id);return idbTx('readwrite',st=>st.delete(id))};
function compress(file,max=1280,q=0.7){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',q))};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Не удалось прочитать изображение'))};im.src=u})}
function viewPhoto(id){const d=PHOTOS.get(id);if(!d)return;document.getElementById('viewerImg').src=d;document.getElementById('viewer').style.display='flex'}
function thumbs(list){list=(list||[]).filter(id=>PHOTOS.has(id));return list.length?`<img class="thumb" src="${PHOTOS.get(list[0])}" onclick="event.stopPropagation();viewPhoto('${list[0]}')">${list.length>1?'<span class="muted">📷'+list.length+'</span>':''}`:''}
let PH=null,PHB=null; /* редактирование фото в диалоге: {list, added:[]}; PHB — фото велосипеда в форме арендатора */
const PHS={PH:{sfx:''},PHB:{sfx:'B'}};const phObj=k=>k==='PHB'?PHB:PH;
function photoField(list,label,k='PH'){const o={list:[...(list||[])],added:[]};if(k==='PHB')PHB=o;else{PH=o;PHB=null}const x=PHS[k].sfx;return `<label>${label}</label><div class="ph" id="phBox${x}"></div><input type="file" id="phIn${x}" accept="image/*" multiple onchange="addPhotos(this,'${k}')"><div class="muted" id="phMsg${x}"></div>`}
function drawPh(k='PH'){const o=phObj(k);if(!o)return;const b=document.getElementById('phBox'+PHS[k].sfx);if(b)b.innerHTML=o.list.map(id=>`<div><img src="${PHOTOS.get(id)||''}" onclick="viewPhoto('${id}')"><button type="button" title="Удалить" onclick="phObj('${k}').list=phObj('${k}').list.filter(x=>x!=='${id}');drawPh('${k}')">×</button></div>`).join('')||'<span class="muted">Нет фото</span>'}
async function addPhotos(inp,k='PH'){const o=phObj(k),m=document.getElementById('phMsg'+PHS[k].sfx);m.textContent='Обработка…';for(const f of inp.files){try{const id='ph_'+uid();await putPhoto(id,await compress(f));o.list.push(id);o.added.push(id)}catch(e){alert(e.message)}}inp.value='';m.textContent='';drawPh(k)}
/* удалить из IndexedDB фото, на которые больше никто не ссылается */
function gcPhotos(){const used=new Set();[...db.bikes,...db.clients].forEach(o=>(o.photos||[]).forEach(id=>used.add(id)));[...PHOTOS.keys()].forEach(id=>{if(!used.has(id))delPhoto(id)})}
function withPhotos(owner){const prev=dlg.onclose;dlg.onclose=()=>{if(dlg.returnValue==='ok'){prev();}else{PH.added.forEach(delPhoto);if(PHB)PHB.added.forEach(delPhoto)}gcPhotos()};drawPh();drawPh('PHB')}
/* Даты — строки YYYY-MM-DD, арифметика в днях по UTC (без проблем с переходом времени) */
const DAY=86400000;const dnum=s=>Date.parse(s+'T00:00:00Z')/DAY;const dstr=n=>new Date(n*DAY).toISOString().slice(0,10);
let TODAY_OVERRIDE=null;const today=()=>TODAY_OVERRIDE||(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})();
const fd=s=>s?s.split('-').reverse().join('.'):'—';
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db||!db.bikes)db={settings:{penaltyPerDay:0,defaultWeekly:3500},bikes:[],clients:[],rentals:[]};db.settings=db.settings||{penaltyPerDay:0,defaultWeekly:3500};
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));save();
const bike=id=>db.bikes.find(x=>x.id===id)||{num:'(удалён)',vin:''};const client=id=>db.clients.find(x=>x.id===id)||{name:'(удалён)',phone:''};
const bname=b=>b.num+' '+[b.brand,b.model].filter(Boolean).join(' ')+' · '+b.vin;
/* миграция старых данных */
/* однократно: удалить демо-данные (флаг demo), записи пользователя не трогаем */
if(!db.settings.demoPurged){const ib=new Set(db.bikes.filter(b=>b.demo).map(b=>b.id)),ic=new Set(db.clients.filter(c=>c.demo).map(c=>c.id));
 db.rentals=db.rentals.filter(r=>!ib.has(r.bikeId)&&!ic.has(r.clientId));db.bikes=db.bikes.filter(b=>!ib.has(b.id));db.clients=db.clients.filter(c=>!ic.has(c.id));db.settings.demoPurged=true;save()}
db.bikes.forEach(b=>{if(b.tracker===undefined)b.tracker='';if(!b.photos)b.photos=[];for(const k of ['brand','battery1','battery2'])if(b[k]===undefined)b[k]=''});db.clients.forEach(c=>{if(!c.photos)c.photos=[]});db.rentals.forEach(normRental);save();

/* ===== Позиции аренды (parts) =====
 Аренда состоит из позиций {name, weekly, weeks}. Неделя k (0,1,2…): позиция действует, пока k < weeks (или всегда, если weeks пусто).
 Сумма недели = сумма действующих позиций. Старые аренды (без parts) → одна позиция «Велосипед». r.weekly/r.weeks хранятся для совместимости. */
function weekAmt(r,k){return r.parts.reduce((a,p)=>a+(!(p.weeks>0)||k<p.weeks?(+p.weekly||0):0),0)}
function maxWeeks(r){return Math.max(0,...r.parts.map(p=>+p.weeks||0))}
function syncLegacy(r){r.weekly=weekAmt(r,0);r.weeks=maxWeeks(r);return r}
function normRental(r){if(!Array.isArray(r.parts)||!r.parts.length)r.parts=[{name:'Велосипед',weekly:+r.weekly||0,weeks:r.buyout&&+r.weeks>0?+r.weeks:null}];
 r.parts=r.parts.map(p=>({name:String(p.name??'').trim()||'Позиция',weekly:+p.weekly||0,weeks:+p.weeks>0?Math.floor(+p.weeks):null}));return syncLegacy(r)}
const curK=r=>Math.max(0,Math.floor((dnum(today())-dnum(r.start))/7));
const curWeekly=r=>weekAmt(r,curK(r));
/* следующая смена суммы недели (когда позиция заканчивается) */
function nextChange(r){const k0=curK(r),a0=weekAmt(r,k0),N=maxWeeks(r);for(let k=k0+1;k<=N;k++){const a=weekAmt(r,k);if(a!==a0)return {k,due:dstr(dnum(r.start)+7*k),amount:a}}return null}
/* прогресс позиции: сколько её недель полностью оплачено */
function partProg(r,c){return r.parts.map(p=>({...p,paidW:c.sch.filter(x=>x.status==='оплачено'&&(!(p.weeks>0)||x.k<p.weeks)).length,total:p.weeks>0?p.weekly*p.weeks:null}))}
function partsTable(r,c){const P=partProg(r,c),nc=r.end?null:nextChange(r);
 return `<div class="card tw" id="rvParts"><h2>Позиции</h2><table><tr><th>Позиция</th><th>₽/нед</th><th>Сумма</th><th>Прогресс</th></tr>${P.map(p=>`<tr class="${p.weeks>0&&p.paidW>=p.weeks?'paid':''}"><td>${esc(p.name)}</td><td>${rub(p.weekly)}</td><td>${p.total!=null?rub(p.total)+` <span class="muted">(${p.weeks} нед)</span>`:'<span class="muted">без срока</span>'}</td><td>оплачено ${p.weeks>0?`${Math.min(p.paidW,p.weeks)} из ${p.weeks}`:p.paidW} нед</td></tr>`).join('')}
 <tr><td><b>Итого в неделю</b></td><td><b id="rvWeekly">${rub(r.end?weekAmt(r,curK(r)):curWeekly(r))}</b></td><td>${P.every(p=>p.total!=null)?rub(P.reduce((a,p)=>a+p.total,0)):''}</td><td class="muted">${nc?`с ${fd(nc.due)} — ${rub(nc.amount)}/нед`:''}</td></tr></table></div>`}
const partsBrief=r=>r.parts.length>1?' ('+r.parts.map(p=>esc(p.name)+' '+rub(p.weekly)).join(' + ')+')':'';
/* ===== Редактор позиций в форме ===== */
const partRow=p=>`<div class="row part" style="align-items:flex-end"><div style="flex:2 1 140px"><label>Позиция</label><input class="pn" value="${esc(p.name)}"></div><div><label>₽ в неделю</label><input class="pw" type="number" min="1" value="${p.weekly??''}" oninput="bcalc();rinfo()"></div><div><label>Недель</label><input class="pwk" type="number" min="0" placeholder="без срока" value="${p.weeks||''}" oninput="bcalc('w');rinfo()"></div><div style="flex:0 0 auto"><button type="button" class="btn sm red pdel" title="Удалить позицию" onclick="delPart(this)">✕</button></div></div>`;
const partsEditor=parts=>`<label>Позиции (что входит в аренду)</label><div id="parts">${parts.map(partRow).join('')}</div><button type="button" class="btn sm sec" id="addPartBtn" onclick="addPart()">+ Добавить позицию</button><div class="muted" id="pSum"></div>`;
function partIds(){const R=[...document.querySelectorAll('#parts .part')];R.forEach((e,i)=>{e.querySelector('.pn').id='nPn'+(i||'');e.querySelector('.pw').id='nW'+(i||'');e.querySelector('.pwk').id='nWk'+(i||'');e.querySelector('.pdel').style.visibility=R.length>1?'visible':'hidden'})}
function addPart(){document.getElementById('parts').insertAdjacentHTML('beforeend',partRow({name:'',weekly:'',weeks:''}));partIds();bcalc();rinfo()}
function delPart(b){b.closest('.part').remove();partIds();bcalc();rinfo()}
const readParts=()=>[...document.querySelectorAll('#parts .part')].map(e=>({name:e.querySelector('.pn').value.trim()||'Позиция',weekly:+e.querySelector('.pw').value||0,weeks:Math.max(0,Math.floor(+e.querySelector('.pwk').value||0))||null}));

/* ===== Расчёты =====
 Платёж за неделю вносится авансом: даты начислений = старт + 7·k (k=0,1,2…).
 Обычная аренда: начислено всё, срок чего наступил (≤ сегодня; для закрытой — до даты окончания).
 Сумма недели k = weekAmt(r,k) (сумма действующих позиций).
 Выкуп: N = макс. срок позиций, платёж недели = weekAmt; итоговая цена = buyoutPrice (последний платёж — остаток).
 Оплаты разносятся по начислениям по порядку (FIFO).
 Долг = начислено к сегодня − оплачено. Просрочка (дн.) = сегодня − дата старейшего неоплаченного начисления.
 Пеня = просрочка (дн.) × ставка пени/день (настройка) — начисляется информационно, в долг аренды добавляется отдельной строкой. */
function schedule(r,asOf){const t=dnum(asOf||today()),s=dnum(r.start);const out=[];
 if(r.buyout){const N=maxWeeks(r)||r.weeks;let left=r.buyoutPrice;for(let k=0;k<N&&left>0.001;k++){const a=k===N-1?left:Math.min(weekAmt(r,k),left);if(a>0)out.push({k,due:dstr(s+7*k),amount:a});left-=a}}
 else{const lim=r.end?Math.min(t,dnum(r.end)-1):t;let k=0;for(;s+7*k<=lim;k++){const a=weekAmt(r,k);if(a>0)out.push({k,due:dstr(s+7*k),amount:a})}
  if(k===0){out.push({k:0,due:r.start,amount:weekAmt(r,0)});k=1}
  if(!r.end){/* показать следующий платёж */const a=weekAmt(r,k);if(a>0)out.push({k,due:dstr(s+7*k),amount:a,future:true})}}
 return out}
const paidSum=r=>r.payments.reduce((s,p)=>s+(+p.amount||0),0);
function calc(r,asOf){const T=asOf||today(),t=dnum(T);const sch=schedule(r,T);let pool=paidSum(r);let accrued=0,odDays=0,nextDue=null;
 sch.forEach(x=>{const dueNow=!x.future&&dnum(x.due)<=t;x.paid=Math.min(pool,x.amount);pool-=x.paid;x.status=x.paid>=x.amount-0.001?'оплачено':(dueNow?'долг':'ожидается');
  if(dueNow)accrued+=x.amount;if(x.status==='долг'&&!odDays)odDays=t-dnum(x.due);if(x.status!=='оплачено'&&!nextDue)nextDue=x});

function bcalc(src){const g=id=>document.getElementById(id);if(!g('parts')||!g('nBuy'))return;
 const buy=g('nBuy').checked,P=+(g('nP')||{}).value||0,W=+g('nWk').value;
 if(buy&&src==='w'&&W>0&&readParts().length===1&&g('nBuyBox'))g('nW').value=Math.ceil(P/W);
 const r=normRental({start:today(),parts:readParts()}),N=maxWeeks(r);let tot=0;for(let k=0;k<N;k++)tot+=weekAmt(r,k);
 if(g('pSum'))g('pSum').textContent=`Итого в неделю: ${rub(weekAmt(r,0))}`+(N?` · за ${N} нед по позициям: ${rub(tot)}`:'');
 if(!buy||!g('nHint'))return;g('nHint').textContent=`${N} нед, по позициям ${rub(tot)} (выкуп ${rub(P)}; последний платёж — остаток)`;
 if(tot<P)g('nHint').textContent+=' ⚠ сумма по позициям меньше цены выкупа!'}

function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function csvData(kind){if(kind==='bikes')return [['Номер','Марка','Модель','VIN','Номер трекера','Аккумулятор 1','Аккумулятор 2','Цвет','Год','Мощность Вт','Пробег км','Статус'],...db.bikes.map(b=>[b.num,b.brand,b.model,b.vin,b.tracker,b.battery1,b.battery2,b.color,b.year,b.power,b.mileage,ST[b.status]])];
 if(kind==='payments'){const R=[['Дата','Сумма','Способ','Комментарий','Арендатор','Телефон','Велосипед','VIN','Тип аренды']];db.rentals.forEach(r=>r.payments.forEach(p=>R.push([p.date,p.amount,p.method,p.note,client(r.clientId).name,client(r.clientId).phone,bike(r.bikeId).num,bike(r.bikeId).vin,r.buyout?'выкуп':'аренда'])));return R}
 return [['Арендатор','Телефон','Велосипед','VIN','Дней просрочки','Долг','Пеня','Итого'],...active().map(r=>({r,c:calc(r)})).filter(x=>x.c.debt>0).sort((a,b)=>b.c.totalDebt-a.c.totalDebt).map(({r,c})=>[client(r.clientId).name,client(r.clientId).phone,bike(r.bikeId).num,bike(r.bikeId).vin,c.odDays,c.debt,c.penalty,c.totalDebt])]}
const exportCSV=k=>download(k+'-'+today()+'.csv',csv(csvData(k)),'text/csv');
V.data=()=>`<div class="card"><h2>Настройки</h2><div class="row"><div><label>Пеня за день просрочки, ₽ (0 — без пени)</label><input type="number" min="0" value="${db.settings.penaltyPerDay}" onchange="db.settings.penaltyPerDay=+this.value;save()"></div><div><label>Ставка в неделю по умолчанию, ₽</label><input type="number" value="${db.settings.defaultWeekly}" onchange="db.settings.defaultWeekly=+this.value;save()"></div></div></div>
 <div class="card"><h2>Экспорт CSV</h2><button class="btn" onclick="exportCSV('bikes')">Велосипеды</button><button class="btn" onclick="exportCSV('payments')">Платежи</button><button class="btn" onclick="exportCSV('debts')">Долги</button></div>
 <div class="card"><h2>Резервная копия</h2><button class="btn" onclick="backup()">Скачать JSON (с фото)</button><div class="muted">Фото в базе: ${PHOTOS.size} — файл копии может быть большим (~150–300 КБ на фото).</div><label>Восстановить из JSON</label><input type="file" accept=".json,application/json" onchange="restore(this.files[0])"></div>
 <div class="card"><h2>Добавить из файла</h2><p class="muted">Импорт JSON (формат bike-import-v1 или резервная копия) с ОБЪЕДИНЕНИЕМ: ничего не удаляется, дубли (VIN; телефон/ФИО) пропускаются.</p><button class="btn" onclick="document.getElementById('mergeIn').click()">Добавить из файла</button><input type="file" id="mergeIn" hidden accept=".json,application/json" onchange="mergeFile(this.files[0]);this.value=''"></div>
 <div class="card"><h2>Очистка</h2><button class="btn sec" onclick="if(confirm('Стереть ВСЕ данные?')){db={settings:db.settings,bikes:[],clients:[],rentals:[]};save();gcPhotos();render()}">Стереть всё</button></div>`;
function backup(){const ph={};PHOTOS.forEach((v,k)=>ph[k]=v);const json=JSON.stringify({...db,photoData:ph});
 const mb=json.length/1048576;if(mb>5&&!confirm('Резервная копия ≈ '+mb.toFixed(1)+' МБ из-за фото. Скачать?'))return;download('ebike-backup-'+today()+'.json',json,'application/json')}
function restore(f){if(!f)return;f.text().then(async t=>{const d=JSON.parse(t);if(!Array.isArray(d.bikes)||!Array.isArray(d.clients)||!Array.isArray(d.rentals))throw 0;
 if(!confirm('Заменить текущие данные?'+(d.photoData?' Фото в копии: '+Object.keys(d.photoData).length:'')))return;const ph=d.photoData||{};delete d.photoData;
 for(const id of [...PHOTOS.keys()])await delPhoto(id);for(const [k,v] of Object.entries(ph))await putPhoto(k,v);
 db=d;db.settings=db.settings||{penaltyPerDay:0,defaultWeekly:3500};db.bikes.forEach(b=>{b.tracker=b.tracker||'';b.photos=b.photos||[];for(const k of ['brand','battery1','battery2'])b[k]=b[k]||''});db.clients.forEach(c=>c.photos=c.photos||[]);db.rentals.forEach(normRental);save();render();alert('Восстановлено')}).catch(e=>{console.warn(e);alert('Неверный файл')})}
/* ===== Импорт с объединением (bike-import-v1) ===== */
const str=x=>x==null?'':String(x).trim();const numv=x=>x===''||x==null||isNaN(+x)?0:+x;
const normPhone=p=>str(p).replace(/\D/g,'').replace(/^8(\d{10})$/,'7$1');
function mergeData(d){const st={nb:0,nc:0,nr:0,skip:0,notes:[]};
 if(d.format!=='bike-import-v1'){/* резервная копия приложения → привести к формату */
  if(!Array.isArray(d.bikes))throw new Error('Неизвестный формат');const bk={},cl={};
  d.bikes.forEach(b=>bk[b.id]=b.vin);(d.clients||[]).forEach(c=>cl[c.id]=c.name);
  d={bikes:d.bikes.map(b=>({...b,num:b.num})),tenants:(d.clients||[]).map(c=>({fio:c.name,phone:c.phone,passport:c.passport})),rentals:(d.rentals||[]).filter(r=>!r.end).map(r=>({bikeVin:bk[r.bikeId],tenantFio:cl[r.clientId],start:r.start,weeklyRate:r.weekly,deposit:r.deposit,buyoutPrice:r.buyout?r.buyoutPrice:0,buyoutWeeks:r.weeks,parts:r.parts,_payments:r.payments}))}}
 const vinMap=new Map(db.bikes.filter(b=>b.vin).map(b=>[b.vin.toUpperCase(),b]));
 (d.bikes||[]).forEach(x=>{const vin=str(x.vin).toUpperCase();if(vin&&vinMap.has(vin)){st.skip++;return}
  const b={id:uid(),num:str(x.num)||'№'+(db.bikes.length+1),brand:str(x.brand),model:str(x.model),vin,tracker:str(x.tracker),color:str(x.color),year:numv(x.year),power:numv(x.power),mileage:numv(x.mileage),battery1:str(x.battery1),battery2:str(x.battery2),photos:[],status:'free'};
  db.bikes.push(b);if(vin)vinMap.set(vin,b);st.nb++});
 const findC=x=>{const ph=normPhone(x.phone),n=str(x.fio||x.name).toLowerCase();return db.clients.find(c=>(ph&&normPhone(c.phone)===ph)||(n&&str(c.name).toLowerCase()===n))};
 (d.tenants||[]).forEach(x=>{if(!str(x.fio||x.name)&&!str(x.phone))return;if(findC(x)){st.skip++;return}
  const pids=(Array.isArray(x.photos)?x.photos:[]).filter(u=>typeof u==='string'&&u.startsWith('data:image')).map(u=>{const id='ph_'+uid();putPhoto(id,u);return id});db.clients.push({id:uid(),name:str(x.fio||x.name),phone:str(x.phone),passport:[str(x.passport),str(x.notes)].filter(Boolean).join('\n'),photos:pids});st.nc++});
 (d.rentals||[]).forEach((x,i)=>{const b=vinMap.get(str(x.bikeVin).toUpperCase()),c=findC({fio:x.tenantFio,phone:x.tenantPhone});
  if(!b||!c){st.skip++;st.notes.push(`аренда #${i+1}: не найден ${!b?'велосипед '+str(x.bikeVin):'арендатор '+str(x.tenantFio)}`);return}
  if(db.rentals.some(r=>!r.end&&r.bikeId===b.id)||!['free','repair'].includes(b.status)){st.skip++;st.notes.push(`аренда #${i+1}: велосипед ${b.vin} уже в аренде`);return}
  const buy=numv(x.buyoutPrice)>0;const r={id:uid(),bikeId:b.id,clientId:c.id,start:str(x.start)||today(),weekly:numv(x.weeklyRate)||db.settings.defaultWeekly,deposit:numv(x.deposit),buyout:buy,buyoutPrice:buy?numv(x.buyoutPrice):0,weeks:buy?numv(x.buyoutWeeks):0,payments:[],end:null,mileageStart:b.mileage};
  if(buy&&!r.weeks)r.weeks=Math.ceil(r.buyoutPrice/r.weekly);
  if(Array.isArray(x.parts)&&x.parts.length){/* позиции заменяют weeklyRate/buyoutWeeks */r.parts=x.parts.map(p=>({name:str(p.name)||'Позиция',weekly:numv(p.weekly),weeks:numv(p.weeks)||null})).filter(p=>p.weekly>0);
   if(buy&&!r.parts.some(p=>p.weeks)){const sw=r.parts.reduce((a,p)=>a+p.weekly,0)||1;r.parts.forEach(p=>p.weeks=Math.ceil(r.buyoutPrice/sw))}}
  normRental(r);
  r.payments=x._payments?x._payments.map(p=>({...p,id:uid()})):histPayments(r,Math.max(0,Math.floor(numv(x.paidWeeks))),numv(x.paidAmount));
  db.rentals.push(r);b.status=buy?'buyout':'rent';checkBuyout(r);st.nr++});
 return st}
